syntax = "proto3";

package netwatch.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/AntoineOparin/netwatch/gen/netwatch/v1;netwatchv1";

// DashboardService is what the web UI calls on the hub.
service DashboardService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Streams latency probe results: first everything within `history`, then
  // each new point as it is measured.
  rpc WatchLatency(WatchLatencyRequest) returns (stream WatchLatencyResponse);
  // Streams each agent's internet throughput the same way.
  rpc WatchThroughput(WatchThroughputRequest) returns (stream WatchThroughputResponse);
  // Lag incidents still going or that ended within `since`, newest first.
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  // Every device ever seen on the LAN, online ones first.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // Give a device a friendly name, e.g. "Xbox". Empty clears it.
  rpc SetDeviceNickname(SetDeviceNicknameRequest) returns (SetDeviceNicknameResponse);
  // The busiest apps on each computer over the window (macOS agents only).
  rpc ListTopApps(ListTopAppsRequest) returns (ListTopAppsResponse);
}

message ListTopAppsRequest {
  google.protobuf.Duration window = 1;
}

message ListTopAppsResponse {
  // Busiest first within each agent.
  repeated AppUsage apps = 1;
}

message AppUsage {
  string agent_id = 1;
  // e.g. "Google Chrome", "OneDrive", "curl".
  string app = 2;
  // Averages over the whole window (idle time counts as zero).
  double avg_download_bytes_per_sec = 3;
  double avg_upload_bytes_per_sec = 4;
  double peak_download_bytes_per_sec = 5;
  double peak_upload_bytes_per_sec = 6;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated LanDevice devices = 1;
}

message LanDevice {
  string mac = 1;
  string ip = 2;
  // Maker looked up from the MAC. Empty when unknown or the MAC is private.
  string vendor = 3;
  // The device made up its MAC for privacy (phones, tablets, laptops), so
  // its maker can't be known.
  bool private_mac = 4;
  // Name the router knows it by (from DHCP).
  string hostname = 5;
  string nickname = 6;
  google.protobuf.Timestamp first_seen = 7;
  google.protobuf.Timestamp last_seen = 8;
  // Seen in the last sweep or two.
  bool online = 9;
  // Has ever answered a ping. Many phones and consoles don't.
  bool answers_ping = 10;
  // LAN round trip over the last 10 minutes, if it answers pings: a fast,
  // steady number means good Wi-Fi (or a cable).
  double ping_avg_ms = 11;
  double ping_jitter_ms = 12;
  double ping_loss = 13; // 0..1
  int32 pings = 14;
  // Set when this device runs the agent.
  string agent_id = 15;
  // The machine running the hub.
  bool is_hub = 16;
  // The default gateway: your router.
  bool is_router = 17;
}

message SetDeviceNicknameRequest {
  string mac = 1;
  string nickname = 2;
}

message SetDeviceNicknameResponse {}

message ListIncidentsRequest {
  google.protobuf.Duration since = 1;
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
}

// Where a lag incident came from.
enum IncidentLocation {
  INCIDENT_LOCATION_UNSPECIFIED = 0;
  // The router was slow too: Wi-Fi or the local network.
  INCIDENT_LOCATION_LOCAL = 1;
  // The router was fine: the connection to the ISP or beyond.
  INCIDENT_LOCATION_UPSTREAM = 2;
}

// A stretch of time when internet pings were much slower than usual, or
// being lost.
message Incident {
  int64 id = 1;
  google.protobuf.Timestamp start = 2;
  // Unset while the incident is still going.
  google.protobuf.Timestamp end = 3;
  IncidentLocation location = 4;
  // Normal internet round trip before it started.
  double baseline_ms = 5;
  double peak_ms = 6;
  int32 lost_pings = 7;
  int32 pings = 8;
  // Computers that were busy at the same time, busiest uploader first.
  repeated Suspect suspects = 9;
}

message Suspect {
  string agent_id = 1;
  // Highest rates seen during the incident (and just before it).
  double peak_upload_bytes_per_sec = 2;
  double peak_download_bytes_per_sec = 3;
  // The app on that computer that moved the most data in the suspect's
  // busy direction, when the agent can tell (macOS).
  string top_app = 4;
}

message WatchThroughputRequest {
  google.protobuf.Duration history = 1;
}

message WatchThroughputResponse {
  repeated ThroughputPoint points = 1;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DOWNLOAD = 1;
  DIRECTION_UPLOAD = 2;
}

message ThroughputPoint {
  string agent_id = 1;
  Direction direction = 2;
  google.protobuf.Timestamp at = 3;
  double bytes_per_sec = 4;
  // Network interface measured, e.g. "en0".
  string interface = 5;
}

message WatchLatencyRequest {
  google.protobuf.Duration history = 1;
}

message WatchLatencyResponse {
  repeated LatencyPoint points = 1;
}

// Where along the path to the internet a probe measures.
enum LatencyTarget {
  LATENCY_TARGET_UNSPECIFIED = 0;
  // Your router.
  LATENCY_TARGET_GATEWAY = 1;
  // The first router past yours, inside the ISP.
  LATENCY_TARGET_ISP = 2;
  // A well-known host on the internet, e.g. 1.1.1.1.
  LATENCY_TARGET_INTERNET = 3;
}

message LatencyPoint {
  LatencyTarget target = 1;
  string addr = 2;
  google.protobuf.Timestamp at = 3;
  // Round-trip time. Unset when the ping was lost.
  double rtt_ms = 4;
  bool lost = 5;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message Agent {
  string id = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string agent_version = 5;
  repeated string ips = 6;
  google.protobuf.Timestamp registered_at = 7;
  google.protobuf.Timestamp last_seen = 8;
  // True when the last heartbeat arrived within a few heartbeat intervals.
  bool online = 9;
}
