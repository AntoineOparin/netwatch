# Run `make gen` (or `buf generate`) after editing anything in proto/.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/app/gen
    opt: target=ts
