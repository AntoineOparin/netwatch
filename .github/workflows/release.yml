name: Release

# Push a tag like v0.1.0 to publish binaries for every platform.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS, so the macOS agent can be built with cgo (it reads Wi-Fi through
    # CoreWLAN). Linux and Windows binaries are pure Go and cross-compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # for `git describe` in the version string

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test
        run: make test

      - name: Build
        run: make release VERSION=${{ github.ref_name }}

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
